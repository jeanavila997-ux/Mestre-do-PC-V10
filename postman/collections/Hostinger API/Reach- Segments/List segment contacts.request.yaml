$kind: http-request
description: |-
  Retrieve contacts associated with a specific segment.

  This endpoint allows you to fetch and filter contacts that belong to a particular segment,
  identified by its UUID.
url: "{{baseUrl}}/api/reach/v1/segmentation/segments/:segmentUuid/contacts?page=<integer>&per_page=25"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: <integer>
    description: Page number
  - key: per_page
    value: "25"
    description: Number of items per page
pathVariables:
  - key: segmentUuid
    value: <string>
    description: (Required) Segment uuid parameter
settings: {}
examples: ./.resources/List segment contacts.resources/examples
order: 3000
