$kind: http-request
description: |-
  Create a new contact segment.

  This endpoint allows creating a new contact segment that can be used to organize contacts.
  The segment can be configured with specific criteria like email, name, subscription status, etc.
url: "{{baseUrl}}/api/reach/v1/segmentation/segments"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "conditions": [
        {
          "operator": "processed",
          "value": "<string>",
          "attribute": "name"
        }
      ],
      "logic": "AND"
    }
settings: {}
examples: ./.resources/Create a new contact segment.resources/examples
order: 2000
