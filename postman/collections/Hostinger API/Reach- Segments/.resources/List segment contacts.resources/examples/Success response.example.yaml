$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/segmentation/segments/:segmentUuid/contacts?page=<integer>&per_page=25"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
  pathVariables:
    - key: segmentUuid
      value: <string>
      description: (Required) Segment uuid parameter
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "uuid": "<string>",
            "name": "<string>",
            "surname": "<string>",
            "email": "<string>",
            "subscription_status": "unsubscribed",
            "subscribed_at": "<dateTime>",
            "source": "sync",
            "note": "<string>"
          },
          {
            "uuid": "<string>",
            "name": "<string>",
            "surname": "<string>",
            "email": "<string>",
            "subscription_status": "subscribed",
            "subscribed_at": "<dateTime>",
            "source": "import",
            "note": "<string>"
          }
        ],
        "meta": {
          "current_page": "<integer>",
          "per_page": "<integer>",
          "total": "<integer>"
        }
      }
order: 1000
