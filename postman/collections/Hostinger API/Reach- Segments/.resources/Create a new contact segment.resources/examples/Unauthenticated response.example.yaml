$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/segmentation/segments"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "conditions": [
          {
            "operator": "processed",
            "value": "<string>",
            "attribute": "name"
          }
        ],
        "logic": "AND"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
