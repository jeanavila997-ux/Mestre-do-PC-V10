$kind: http-example
request:
  url: "{{baseUrl}}/api/billing/v1/subscriptions/:subscriptionId/auto-renewal/enable"
  method: PATCH
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: subscriptionId
      value: <string>
      description: (Required) Subscription ID
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 3000
