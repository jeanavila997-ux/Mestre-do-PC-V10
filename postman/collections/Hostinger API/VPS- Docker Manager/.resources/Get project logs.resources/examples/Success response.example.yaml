$kind: http-example
request:
  url: "{{baseUrl}}/api/vps/v1/virtual-machines/:virtualMachineId/docker/:projectName/logs"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: virtualMachineId
      value: <integer>
      description: (Required) Virtual Machine ID
    - key: projectName
      value: <string>
      description: (Required) Docker Compose project name using alphanumeric characters, dashes, and underscores only
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "service": "<string>",
          "entries": [
            {
              "timestamp": "<string>",
              "line": "<string>"
            },
            {
              "timestamp": "<string>",
              "line": "<string>"
            }
          ]
        },
        {
          "service": "<string>",
          "entries": [
            {
              "timestamp": "<string>",
              "line": "<string>"
            },
            {
              "timestamp": "<string>",
              "line": "<string>"
            }
          ]
        }
      ]
order: 1000
