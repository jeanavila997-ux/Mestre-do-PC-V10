$kind: http-request
description: |-
  Starts all services in a Docker Compose project that are currently stopped. 

  This operation brings up containers in the correct dependency order as defined in the compose file. 

  Use this to resume a project that was previously stopped or to start services after a system reboot.
url: "{{baseUrl}}/api/vps/v1/virtual-machines/:virtualMachineId/docker/:projectName/start"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: virtualMachineId
    value: <integer>
    description: (Required) Virtual Machine ID
  - key: projectName
    value: <string>
    description: (Required) Docker Compose project name using alphanumeric characters, dashes, and underscores only
settings: {}
examples: ./.resources/Start project.resources/examples
order: 8000
