$kind: http-request
description: |-
  Restore a backup for a specified virtual machine.

  The system will then initiate the restore process, which may take some time depending on the size of the backup.

  **All data on the virtual machine will be overwritten with the data from the backup.**

  Use this endpoint to recover VPS data from backup points.
url: "{{baseUrl}}/api/vps/v1/virtual-machines/:virtualMachineId/backups/:backupId/restore"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: virtualMachineId
    value: <integer>
    description: (Required) Virtual Machine ID
  - key: backupId
    value: <integer>
    description: (Required) Backup ID
settings: {}
examples: ./.resources/Restore backup.resources/examples
order: 2000
