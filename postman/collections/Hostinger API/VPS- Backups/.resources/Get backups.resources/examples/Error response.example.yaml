$kind: http-example
request:
  url: "{{baseUrl}}/api/vps/v1/virtual-machines/:virtualMachineId/backups?page=<integer>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: <integer>
      description: Page number
  pathVariables:
    - key: virtualMachineId
      value: <integer>
      description: (Required) Virtual Machine ID
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 3000
