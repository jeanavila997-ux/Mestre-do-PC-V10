$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/contacts?group_uuid=<string>&subscription_status=subscribed&page=<integer>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: group_uuid
      value: <string>
      description: Filter contacts by group UUID
    - key: subscription_status
      value: subscribed
      description: Filter contacts by subscription status (This can only be one of subscribed,unsubscribed)
    - key: page
      value: <integer>
      description: Page number
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 3000
