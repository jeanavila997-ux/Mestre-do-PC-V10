$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/contacts?group_uuid=<string>&subscription_status=subscribed&page=<integer>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: group_uuid
      value: <string>
      description: Filter contacts by group UUID
    - key: subscription_status
      value: subscribed
      description: Filter contacts by subscription status (This can only be one of subscribed,unsubscribed)
    - key: page
      value: <integer>
      description: Page number
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "uuid": "<string>",
            "name": "<string>",
            "surname": "<string>",
            "email": "<string>",
            "subscription_status": "unsubscribed",
            "subscribed_at": "<dateTime>",
            "source": "manual",
            "note": "<string>"
          },
          {
            "uuid": "<string>",
            "name": "<string>",
            "surname": "<string>",
            "email": "<string>",
            "subscription_status": "subscribed",
            "subscribed_at": "<dateTime>",
            "source": "sync",
            "note": "<string>"
          }
        ],
        "meta": {
          "current_page": "<integer>",
          "per_page": "<integer>",
          "total": "<integer>"
        }
      }
order: 1000
