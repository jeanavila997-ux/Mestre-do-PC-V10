$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/contacts/:uuid"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: uuid
      value: <uuid>
      description: (Required) UUID of the contact to delete
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>"
      }
order: 1000
