$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/contacts"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "email": "<string>",
        "name": "<string>",
        "surname": "<string>",
        "note": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "uuid": "<string>",
        "name": "<string>",
        "surname": "<string>",
        "email": "<string>",
        "subscription_status": "subscribed",
        "subscribed_at": "<dateTime>",
        "source": "sync",
        "note": "<string>"
      }
order: 1000
