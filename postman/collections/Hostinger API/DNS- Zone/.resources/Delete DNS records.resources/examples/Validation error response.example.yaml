$kind: http-example
request:
  url: "{{baseUrl}}/api/dns/v1/zones/:domain"
  method: DELETE
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: domain
      value: <string>
      description: (Required) Domain name
  body:
    type: json
    content: |-
      {
        "filters": [
          {
            "name": "<string>",
            "type": "CNAME"
          },
          {
            "name": "<string>",
            "type": "MX"
          }
        ]
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "errors": {
          "field_1": [
            "",
            ""
          ],
          "field_2": [
            "",
            ""
          ]
        },
        "correlation_id": "<string>"
      }
order: 3000
