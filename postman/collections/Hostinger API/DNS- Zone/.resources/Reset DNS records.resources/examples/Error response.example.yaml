$kind: http-example
request:
  url: "{{baseUrl}}/api/dns/v1/zones/:domain/reset"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: domain
      value: <string>
      description: (Required) Domain name
  body:
    type: json
    content: |-
      {
        "sync": true,
        "reset_email_records": true,
        "whitelisted_record_types": [
          "<string>",
          "<string>"
        ]
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 4000
