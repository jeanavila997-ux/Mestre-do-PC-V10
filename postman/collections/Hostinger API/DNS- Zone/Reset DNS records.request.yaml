$kind: http-request
description: |-
  Reset DNS zone to the default records.

  Use this endpoint to restore domain DNS to original configuration.
url: "{{baseUrl}}/api/dns/v1/zones/:domain/reset"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: domain
    value: <string>
    description: (Required) Domain name
body:
  type: json
  content: |-
    {
      "sync": true,
      "reset_email_records": true,
      "whitelisted_record_types": [
        "<string>",
        "<string>"
      ]
    }
settings: {}
examples: ./.resources/Reset DNS records.resources/examples
order: 4000
