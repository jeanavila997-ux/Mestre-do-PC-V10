$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/orders?page=<integer>&per_page=25&statuses=suspended&order_ids=<integer>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
    - key: statuses
      value: suspended
      description: Filter by order statuses
    - key: order_ids
      value: <integer>
      description: Filter by specific order IDs
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "id": "<integer>",
            "client_id": "<integer>",
            "subscription_id": "<string>",
            "created_at": "<dateTime>",
            "plan": {
              "name": "<string>"
            },
            "status": "<string>"
          },
          {
            "id": "<integer>",
            "client_id": "<integer>",
            "subscription_id": "<string>",
            "created_at": "<dateTime>",
            "plan": {
              "name": "<string>"
            },
            "status": "<string>"
          }
        ],
        "meta": {
          "current_page": "<integer>",
          "per_page": "<integer>",
          "total": "<integer>"
        }
      }
