$kind: http-example
request:
  url: "{{baseUrl}}/api/hosting/v1/orders?page=<integer>&per_page=25&statuses=suspended&order_ids=<integer>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: <integer>
      description: Page number
    - key: per_page
      value: "25"
      description: Number of items per page
    - key: statuses
      value: suspended
      description: Filter by order statuses
    - key: order_ids
      value: <integer>
      description: Filter by specific order IDs
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
