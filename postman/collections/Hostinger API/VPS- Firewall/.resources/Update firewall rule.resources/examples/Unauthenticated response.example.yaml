$kind: http-example
request:
  url: "{{baseUrl}}/api/vps/v1/firewall/:firewallId/rules/:ruleId"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: firewallId
      value: <integer>
      description: (Required) Firewall ID
    - key: ruleId
      value: <integer>
      description: (Required) Firewall Rule ID
  body:
    type: json
    content: |-
      {
        "protocol": "PostgreSQL",
        "port": "<string>",
        "source": "any",
        "source_detail": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
