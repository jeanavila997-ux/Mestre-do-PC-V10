$kind: http-example
request:
  url: "{{baseUrl}}/api/vps/v1/firewall"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "<integer>",
        "name": "<string>",
        "is_synced": "<boolean>",
        "rules": [
          {
            "id": "<integer>",
            "action": "accept",
            "protocol": "MySQL",
            "port": "<string>",
            "source": "<string>",
            "source_detail": "<string>"
          },
          {
            "id": "<integer>",
            "action": "drop",
            "protocol": "SSH",
            "port": "<string>",
            "source": "<string>",
            "source_detail": "<string>"
          }
        ],
        "created_at": "<dateTime>",
        "updated_at": "<dateTime>"
      }
order: 1000
