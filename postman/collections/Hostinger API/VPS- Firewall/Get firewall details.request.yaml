$kind: http-request
description: |-
  Retrieve firewall by its ID and rules associated with it.

  Use this endpoint to view specific firewall configuration and rules.
url: "{{baseUrl}}/api/vps/v1/firewall/:firewallId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: firewallId
    value: <integer>
    description: (Required) Firewall ID
settings: {}
examples: ./.resources/Get firewall details.resources/examples
order: 3000
