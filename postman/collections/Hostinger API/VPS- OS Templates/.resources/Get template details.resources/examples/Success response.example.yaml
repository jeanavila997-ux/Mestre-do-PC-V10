$kind: http-example
request:
  url: "{{baseUrl}}/api/vps/v1/templates/:templateId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: templateId
      value: <integer>
      description: (Required) Template ID
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "<integer>",
        "name": "<string>",
        "description": "<string>",
        "documentation": "<string>"
      }
order: 1000
