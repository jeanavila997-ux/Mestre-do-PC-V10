$kind: http-request
description: |-
  Set root password for a specified virtual machine.

  Requirements for password are same as in the [recreate virtual machine endpoint](/#tag/vps-virtual-machine/POST/api/vps/v1/virtual-machines/{virtualMachineId}/recreate).

  Use this endpoint to update administrator credentials for VPS instances.
url: "{{baseUrl}}/api/vps/v1/virtual-machines/:virtualMachineId/root-password"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: virtualMachineId
    value: <integer>
    description: (Required) Virtual Machine ID
body:
  type: json
  content: |-
    {
      "password": "<string>"
    }
settings: {}
examples: ./.resources/Set root password.resources/examples
order: 12000
