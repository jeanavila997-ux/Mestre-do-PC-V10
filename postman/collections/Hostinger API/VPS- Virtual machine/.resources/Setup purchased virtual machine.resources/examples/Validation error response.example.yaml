$kind: http-example
request:
  url: "{{baseUrl}}/api/vps/v1/virtual-machines/:virtualMachineId/setup"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: virtualMachineId
      value: <integer>
      description: (Required) Virtual Machine ID
  body:
    type: json
    content: |-
      {
        "data_center_id": "<integer>",
        "template_id": "<integer>",
        "post_install_script_id": "<integer>",
        "password": "<string>",
        "hostname": "<string>",
        "install_monarx": false,
        "enable_backups": true,
        "ns1": "<string>",
        "ns2": "<string>",
        "public_key": {
          "name": "<string>",
          "key": "<string>"
        }
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "errors": {
          "field_1": [
            "",
            ""
          ],
          "field_2": [
            "",
            ""
          ]
        },
        "correlation_id": "<string>"
      }
order: 3000
