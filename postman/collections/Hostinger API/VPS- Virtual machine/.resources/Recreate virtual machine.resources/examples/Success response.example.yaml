$kind: http-example
request:
  url: "{{baseUrl}}/api/vps/v1/virtual-machines/:virtualMachineId/recreate"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: virtualMachineId
      value: <integer>
      description: (Required) Virtual Machine ID
  body:
    type: json
    content: |-
      {
        "template_id": "<integer>",
        "password": "<string>",
        "panel_password": "<string>",
        "post_install_script_id": "<integer>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "<integer>",
        "name": "<string>",
        "state": "success",
        "created_at": "<dateTime>",
        "updated_at": "<dateTime>"
      }
order: 1000
