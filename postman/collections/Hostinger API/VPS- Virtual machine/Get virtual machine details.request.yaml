$kind: http-request
description: |-
  Retrieve detailed information about a specified virtual machine.

  Use this endpoint to view comprehensive VPS configuration and status.
url: "{{baseUrl}}/api/vps/v1/virtual-machines/:virtualMachineId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: virtualMachineId
    value: <integer>
    description: (Required) Virtual Machine ID
settings: {}
examples: ./.resources/Get virtual machine details.resources/examples
order: 4000
