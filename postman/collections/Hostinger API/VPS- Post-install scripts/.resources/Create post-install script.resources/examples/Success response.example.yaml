$kind: http-example
request:
  url: "{{baseUrl}}/api/vps/v1/post-install-scripts"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "content": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "<integer>",
        "name": "<string>",
        "content": "<string>",
        "created_at": "<dateTime>",
        "updated_at": "<dateTime>"
      }
order: 1000
