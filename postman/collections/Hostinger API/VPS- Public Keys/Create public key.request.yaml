$kind: http-request
description: |-
  Add a new public key to your account.

  Use this endpoint to register SSH keys for VPS authentication.
url: "{{baseUrl}}/api/vps/v1/public-keys"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "key": "<string>"
    }
settings: {}
examples: ./.resources/Create public key.resources/examples
order: 4000
