$kind: http-example
request:
  url: "{{baseUrl}}/api/vps/v1/public-keys/attach/:virtualMachineId"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: virtualMachineId
      value: <integer>
      description: (Required) Virtual Machine ID
  body:
    type: json
    content: |-
      {
        "ids": [
          "<integer>",
          "<integer>"
        ]
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
