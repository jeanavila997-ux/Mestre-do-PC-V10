$kind: http-request
description: |-
  Retrieve public keys associated with your account.

  Use this endpoint to view available SSH keys for VPS authentication.
url: "{{baseUrl}}/api/vps/v1/public-keys?page=<integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: <integer>
    description: Page number
settings: {}
examples: ./.resources/Get public keys.resources/examples
order: 3000
