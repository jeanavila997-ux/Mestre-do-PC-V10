$kind: http-example
request:
  url: "{{baseUrl}}/api/v2/direct/verifications/active"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "domains": [
          "<string>",
          "<string>"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "PENDING": {
            "DOMAIN.TLD": {
              "VERIFICATION_TYPE": {
                "records": [
                  "<string>",
                  "<string>"
                ],
                "last_verification_attempt": "<string>",
                "next_verification_attempt": "<string>",
                "verification_expiration": "<string>"
              }
            }
          },
          "VERIFIED": {
            "DOMAIN.TLD": {
              "VERIFICATION_TYPE": {
                "records": [
                  "<string>",
                  "<string>"
                ]
              }
            }
          }
        }
      }
order: 1000
