$kind: http-example
request:
  url: "{{baseUrl}}/api/vps/v1/virtual-machines/:virtualMachineId/actions/:actionId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: virtualMachineId
      value: <integer>
      description: (Required) Virtual Machine ID
    - key: actionId
      value: <integer>
      description: (Required) Action ID
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 2000
