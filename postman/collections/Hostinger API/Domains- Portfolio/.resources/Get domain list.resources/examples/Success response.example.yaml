$kind: http-example
request:
  url: "{{baseUrl}}/api/domains/v1/portfolio"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "id": "<integer>",
          "domain": "<string>",
          "type": "domain",
          "status": "active",
          "created_at": "<dateTime>",
          "expires_at": "<dateTime>"
        },
        {
          "id": "<integer>",
          "domain": "<string>",
          "type": "free_domain",
          "status": "requested",
          "created_at": "<dateTime>",
          "expires_at": "<dateTime>"
        }
      ]
order: 1000
