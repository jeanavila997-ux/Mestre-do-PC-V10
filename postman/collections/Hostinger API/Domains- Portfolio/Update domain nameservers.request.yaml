$kind: http-request
description: |-
  Set nameservers for a specified domain.

  Be aware, that improper nameserver configuration can lead to the domain being unresolvable or unavailable.

  Use this endpoint to configure custom DNS hosting for domains.
url: "{{baseUrl}}/api/domains/v1/portfolio/:domain/nameservers"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: domain
    value: <string>
    description: (Required) Domain name
body:
  type: json
  content: |-
    {
      "ns1": "<string>",
      "ns2": "<string>",
      "ns3": "<string>",
      "ns4": "<string>"
    }
settings: {}
examples: ./.resources/Update domain nameservers.resources/examples
order: 8000
