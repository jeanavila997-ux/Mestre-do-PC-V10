$kind: http-request
description: |-
  Enable privacy protection for the domain.

  When privacy protection is enabled, domain owner's personal information is hidden from public WHOIS database.

  Use this endpoint to protect domain owner's personal information from public view.
url: "{{baseUrl}}/api/domains/v1/portfolio/:domain/privacy-protection"
method: PUT
headers:
  Accept: application/json
pathVariables:
  - key: domain
    value: <string>
    description: (Required) Domain name
settings: {}
examples: ./.resources/Enable privacy protection.resources/examples
order: 6000
