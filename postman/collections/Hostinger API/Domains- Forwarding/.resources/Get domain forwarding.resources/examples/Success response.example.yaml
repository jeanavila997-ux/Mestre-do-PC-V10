$kind: http-example
request:
  url: "{{baseUrl}}/api/domains/v1/forwarding/:domain"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: domain
      value: <string>
      description: (Required) Domain name
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "domain": "<string>",
        "redirect_type": "302",
        "redirect_url": "<string>",
        "created_at": "<dateTime>",
        "updated_at": "<dateTime>"
      }
order: 1000
