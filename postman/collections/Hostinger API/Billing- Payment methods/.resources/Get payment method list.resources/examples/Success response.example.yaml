        {
          "id": "<integer>",
          "name": "<string>",
          "identifier": "<string>",
          "payment_method": "<string>",
          "is_default": "<boolean>",
          "is_expired": "<boolean>",
          "is_suspended": "<boolean>",
          "created_at": "<dateTime>",
          "expires_at": "<dateTime>"
        },
        {
          "id": "<integer>",
          "name": "<string>",
          "identifier": "<string>",
          "payment_method": "<string>",
          "is_default": "<boolean>",
          "is_expired": "<boolean>",
          "is_suspended": "<boolean>",
          "created_at": "<dateTime>",
          "expires_at": "<dateTime>"
        }
      ]
order: 1000
