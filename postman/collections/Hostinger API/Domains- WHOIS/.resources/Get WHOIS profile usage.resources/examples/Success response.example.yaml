$kind: http-example
request:
  url: "{{baseUrl}}/api/domains/v1/whois/:whoisId/usage"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: whoisId
      value: <integer>
      description: (Required) WHOIS ID
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        "<string>",
        "<string>"
      ]
order: 1000
