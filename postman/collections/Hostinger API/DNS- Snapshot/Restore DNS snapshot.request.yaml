$kind: http-request
description: |-
  Restore DNS zone to the selected snapshot.

  Use this endpoint to revert domain DNS to a previous configuration.
url: "{{baseUrl}}/api/dns/v1/snapshots/:domain/:snapshotId/restore"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: domain
    value: <string>
    description: (Required) Domain name
  - key: snapshotId
    value: <integer>
    description: (Required) Snapshot ID
settings: {}
examples: ./.resources/Restore DNS snapshot.resources/examples
order: 3000
