        "reason": "<string>",
        "snapshot": [
          {
            "name": "<string>",
            "records": [
              {
                "content": "<string>",
                "is_disabled": "<boolean>"
              },
              {
                "content": "<string>",
                "is_disabled": "<boolean>"
              }
            ],
            "ttl": "<integer>",
            "type": "A"
          },
          {
            "name": "<string>",
            "records": [
              {
                "content": "<string>",
                "is_disabled": "<boolean>"
              },
              {
                "content": "<string>",
                "is_disabled": "<boolean>"
              }
            ],
