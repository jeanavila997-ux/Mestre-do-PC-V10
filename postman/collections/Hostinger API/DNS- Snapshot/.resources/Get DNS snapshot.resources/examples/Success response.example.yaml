$kind: http-example
request:
  url: "{{baseUrl}}/api/dns/v1/snapshots/:domain/:snapshotId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: domain
      value: <string>
      description: (Required) Domain name
    - key: snapshotId
      value: <integer>
      description: (Required) Snapshot ID
