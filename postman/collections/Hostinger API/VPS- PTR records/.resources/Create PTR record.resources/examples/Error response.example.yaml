$kind: http-example
request:
  url: "{{baseUrl}}/api/vps/v1/virtual-machines/:virtualMachineId/ptr/:ipAddressId"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: virtualMachineId
      value: <integer>
      description: (Required) Virtual Machine ID
    - key: ipAddressId
      value: <integer>
      description: (Required) IP Address ID
  body:
    type: json
    content: |-
      {
        "domain": "<string>"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>",
        "correlation_id": "<string>"
      }
order: 4000
