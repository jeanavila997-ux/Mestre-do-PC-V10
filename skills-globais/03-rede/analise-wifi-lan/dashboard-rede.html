    :root {

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;

    .bars { display: flex; flex-direction: column; gap: 0.65rem; }
    .bar-row { display: grid; grid-template-columns: 1fr 64px; gap: 0.5rem; align-items: center; }
    .bar-track { height: 10px; background: #122233; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #0891b2, var(--cyan)); border-radius: 999px; }
    .bar-row span { font-size: 0.8rem; color: var(--muted); text-align: right; }
    pre.code {
      margin: 0; padding: 0.9rem 1rem; background: #071018; border: 1px solid var(--line);
      border-radius: 10px; overflow: auto; font-size: 0.8rem; line-height: 1.45; color: #c7e9ff;
      white-space: pre-wrap;
    }
    .cmd-list { display: flex; flex-direction: column; gap: 0.85rem; }
    .cmd-item details { border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); }
    .cmd-item summary {
      cursor: pointer; padding: 0.75rem 0.9rem; font-weight: 600; list-style: none;
    }
    .cmd-item summary::-webkit-details-marker { display: none; }
    .cmd-item .body { padding: 0 0.9rem 0.9rem; }
    .compare {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.75rem; align-items: stretch;
    }
    @media (max-width: 700px) {
      .compare { grid-template-columns: 1fr; }

    }
    .compare .vs {
      align-self: center; color: var(--muted); font-weight: 700; font-size: 0.85rem;
    }
    .muted { color: var(--muted); }
    .footnote { margin-top: 1.5rem; color: var(--muted); font-size: 0.8rem; line-height: 1.5; }
  </style>
</head>

          h('div', null,

            h(WifiCard, { title: 'Depois — REDE-5G', w: data.wifi.depois })
          ),
          h('div', { className: 'card' },
            h('h2', null, 'Gateway / DNS / perfis'),
            h('table', null,
              h('tbody', null,
                h('tr', null, h('th', null, 'Gateway'), h('td', { className: 'mono' }, `${data.wifi.gateway.ip} (~${data.wifi.gateway.latenciaMs} ms) — ${data.wifi.gateway.vendor}`)),
                h('tr', null, h('th', null, 'DNS'), h('td', { className: 'mono' }, data.wifi.dns.join(', '))),
                h('tr', null, h('th', null, 'Perfis salvos'), h('td', null, data.wifi.perfisSalvos.join(', ')))
              )
            )
          )
        );
      }

      if (section === 'speed') {
        body = h(React.Fragment, null,
          h('div', { className: 'grid2' },
            h('div', { className: 'card' },
              h('h2', null, 'Download/Upload — 2,4 GHz'),
              h(SpeedBars, { rows: data.speed.antes24, max: maxSpeed })
            ),
            h('div', { className: 'card' },
              h('h2', null, 'Download/Upload — 5 GHz'),
              h(SpeedBars, { rows: data.speed.depois5g, max: maxSpeed })
            )
          ),
          h('div', { className: 'card' },
            h('h2', null, 'Latência'),
            h('table', null,
              h('thead', null, h('tr', null, h('th', null, 'Host'), h('th', null, 'avg ms'))),
              h('tbody', null, data.speed.latencia.map((l) =>
                h('tr', { key: l.host }, h('td', { className: 'mono' }, l.host), h('td', null, l.avgMs))
              ))
            )
          ),
          h('div', { className: 'card' },
            h('h2', null, 'ISP / IP público'),
            h('table', null,
              h('tbody', null,
                Object.entries(data.speed.isp).map(([k, v]) =>
                  h('tr', { key: k }, h('th', null, k), h('td', { className: 'mono' }, String(v)))
                )
              )
            ),
            h('p', { style: { marginTop: '0.8rem' } },
              h('span', { className: 'pill bad' }, 'Mestre speedtest mini'),
              ' ', data.speed.mestreSpeedtestMini.status, ' — ', data.speed.mestreSpeedtestMini.motivo,
              ' (', data.speed.mestreSpeedtestMini.valorEnganoso, ')'
            )
          )
        );
      }

      if (section === 'lan') {
        body = h(React.Fragment, null,
          h('div', { className: 'card' },
            h('h2', null, `Dispositivos em ${data.lan.rede}`),
            h('table', null,
              h('thead', null, h('tr', null,
                h('th', null, 'IP'), h('th', null, 'MAC'), h('th', null, 'Vendor'), h('th', null, 'Papel'), h('th', null, 'ms')
              )),
              h('tbody', null, data.lan.dispositivos.map((d) =>
                h('tr', { key: d.ip },
                  h('td', { className: 'mono' }, d.ip),
                  h('td', { className: 'mono' }, d.mac),
                  h('td', null, d.vendor),
                  h('td', null, d.papel),
                  h('td', null, d.latMs)
                )
              ))
            )
          ),
          h('div', { className: 'card' },
            h('h2', null, 'Adaptadores ativos'),
            h('table', null,
              h('thead', null, h('tr', null, h('th', null, 'Nome'), h('th', null, 'Descrição'), h('th', null, 'Link'))),
              h('tbody', null, data.lan.adaptadoresAtivos.map((a) =>
                h('tr', { key: a.nome }, h('td', null, a.nome), h('td', null, a.desc), h('td', { className: 'mono' }, a.link))
              ))
            )
          )
        );
      }

      if (section === 'usuarios') {
        body = h(React.Fragment, null,
          h('div', { className: 'card' },
            h('h2', null, 'Sessão'),
            h('p', null, h('span', { className: 'pill ok' }, 'ativo'), ' ', data.usuarios.sessao, ' · ', data.usuarios.dominio)
          ),
          h('div', { className: 'grid2' },
            h('div', { className: 'card' },
              h('h2', null, 'Contas locais'),
              h('table', null,
                h('thead', null, h('tr', null, h('th', null, 'Nome'), h('th', null, 'Enabled'), h('th', null, 'LastLogon'))),
                h('tbody', null, data.usuarios.contasLocais.map((u) =>
                  h('tr', { key: u.nome },
                    h('td', null, u.nome),
                    h('td', null, u.enabled ? h('span', { className: 'pill ok' }, 'sim') : h('span', { className: 'pill warn' }, 'não')),
                    h('td', { className: 'mono' }, u.lastLogon || '—')
                  )
                ))
              )
            ),
            h('div', { className: 'card' },
              h('h2', null, 'Processos por usuário'),
              h('table', null,
                h('thead', null, h('tr', null, h('th', null, 'User'), h('th', null, 'Count'))),
                h('tbody', null, data.usuarios.processosPorUsuario.map((p) =>
                  h('tr', { key: p.user }, h('td', { className: 'mono' }, p.user), h('td', null, p.count))
                ))
              )
            )
          )
        );
      }

      if (section === 'vizinhanca') {
        body = h('div', { className: 'card' },
          h('h2', null, 'SSIDs visíveis (amostra)'),
          h('table', null,
            h('thead', null, h('tr', null,
              h('th', null, 'SSID'), h('th', null, 'Banda'), h('th', null, 'Canal'), h('th', null, 'Sinal'), h('th', null, 'Nota')
            )),
            h('tbody', null, data.vizinhanca.map((v) =>
              h('tr', { key: v.ssid + v.banda },
                h('td', null, v.ssid),
                h('td', null, v.banda),
                h('td', { className: 'mono' }, String(v.canal)),
                h('td', null, v.sinal),
                h('td', { className: 'muted' }, v.nota || '—')
              )
            ))
          )
        );
      }

      if (section === 'codigos') {
        body = h('div', { className: 'cmd-list' },
          data.comandos.map((c) =>
            h('div', { key: c.id, className: 'cmd-item' },
              h('details', { open: c.id === 'analise-script' },
                h('summary', null, c.titulo, ' ', h('span', { className: 'pill warn' }, c.shell)),
                h('div', { className: 'body' }, h('pre', { className: 'code' }, c.codigo))
              )
            )
          )
        );
      }

      if (section === 'scripts') {
        body = h(React.Fragment, null,
          h('div', { className: 'card' },
            h('h2', null, 'Arquivos desta pasta'),
            h('pre', { className: 'code' },
`analisar-rede-mestre.ps1     → coleta ao vivo + JSON live
dados-coletados.json         → snapshot da sessão 31/10/2026
dashboard-rede.html          → este dashboard (React CDN)
web/                         → app Vite + React (npm run dev)
scripts/gerar-escaping-ips.sh → gerador híbrido ipset/iptables (Linux/VPS)`
            )
          ),
          h('div', { className: 'card' },
            h('h2', null, 'Rodar a análise'),
            h('pre', { className: 'code' },
`cd $env:MESTRE_PROJETO_PATH\skills-globais\03-rede\analise-wifi-lan
pwsh -NoProfile -File .\\analisar-rede-mestre.ps1`
            )
          ),
          h('div', { className: 'card' },
            h('h2', null, 'App Vite'),
            h('pre', { className: 'code' },
`cd web
npm install
npm run dev`
            )
          ),
          h('div', { className: 'card' },
            h('h2', null, 'Escaping IPs (Linux)'),
            h('p', { className: 'muted' }, 'Corrige o bug do echo-só-na-tela: create + iptables vão para add_escaping_ips.sh.'),
            h('pre', { className: 'code' },
`# no VPS
./scripts/gerar-escaping-ips.sh ./seu_banco.db
sudo ./add_escaping_ips.sh`
            )
          )
        );
      }

      return h('div', { className: 'shell' },
        h('aside', { className: 'sidebar' },
          h('div', { className: 'brand' },
            h('strong', null, 'Mestre · Rede'),
            h('span', null, 'Dashboard de análise Wi-Fi / LAN')
          ),
          h('nav', { className: 'nav' },
            SECTIONS.map((s) =>
              h('button', {
                key: s.id,
                className: section === s.id ? 'active' : '',
                onClick: () => setSection(s.id),
                type: 'button'
              }, s.label)
            )
          )
        ),
        h('main', { className: 'main' },
          h('div', { className: 'hero' },
            h('div', null,
              h('h1', null, SECTIONS.find((s) => s.id === section)?.label || 'Dashboard'),
              h('p', null, 'Dados da sessão Nitro + REDE-24 / REDE-5G — seções para repartir o relatório.')
            ),
            h('div', { className: 'badge' }, data.meta.coletadoEm, ' · ', data.wifi.depois.ssid)
          ),
          body,
          h('p', { className: 'footnote' },
            'Throughput calculado como (bytes × 8) / segundos / 1e6. Link PHY (netsh) não é a velocidade do provedor. ',
            'IP público e OUI podem mudar; reexecute o script para atualizar o live JSON.'
          )
        )
      );
    }

    // Load React without broken SRI
    function boot() {
      if (!window.React || !window.ReactDOM) {
        const s1 = document.createElement('script');
        s1.src = 'https://unpkg.com/react@18.3.1/umd/react.production.min.js';
        s1.onload = () => {
          const s2 = document.createElement('script');
          s2.src = 'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js';
          s2.onload = () => ReactDOM.createRoot(document.getElementById('root')).render(h(App));
          document.body.appendChild(s2);
        };
        document.body.appendChild(s1);
        return;
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(App));
    }
    boot();
  </script>
</body>
</html>
