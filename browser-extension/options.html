<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opções - Mestre do PC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 24px;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #8b949e; margin-top: 0; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; }
    input[type="text"], input[type="url"] {
      width: 100%;
      max-width: 420px;
      padding: 10px 12px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #161b22;
      color: #e6edf3;
    }
    input[type="checkbox"] { margin-right: 8px; }
    .hint { font-size: 12px; color: #8b949e; margin-top: 6px; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #a200ff, #00d4ff);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { opacity: 0.9; }
    #status { margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Opções da extensão Mestre do PC</h1>
  <p>Configure a comunicação segura com o app local.</p>

  <div class="form-group">
    <label for="launcherUrl">URL do Launcher do Mestre do PC</label>
    <input type="url" id="launcherUrl" value="http://127.0.0.1:7777" />
    <div class="hint">Padrão: http://127.0.0.1:7777</div>
  </div>

  <div class="form-group">
    <label for="extensionToken">Token de extensão</label>
    <input type="text" id="extensionToken" placeholder="cole o token configurado no launcher" />
    <div class="hint">O token é definido pela variável de ambiente MESTRE_EXTENSION_TOKEN no launcher.</div>
  </div>

  <div class="form-group">
    <label>
      <input type="checkbox" id="chathubEnabled" />
      Habilitar integração com Chat Hub
    </label>
  </div>

  <div class="form-group">
    <label for="chathubUrl">URL do Chat Hub</label>
    <input type="url" id="chathubUrl" value="http://127.0.0.1:3000" />
    <div class="hint">Endpoint local do Chat Hub para verificação de status.</div>
  </div>

  <button id="save">Salvar</button>
  <div id="status"></div>

  <script type="module" src="options.js"></script>
</body>
</html>
