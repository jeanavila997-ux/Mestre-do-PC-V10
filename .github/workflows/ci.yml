name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install MCP dependencies
        working-directory: mcp-server
        # @qwen-code/cua-sdk não é dependência deste pacote: o import fica em
        # v10/computer-use-client.js e resolve v10/node_modules ou a raiz.
        # --ignore-scripts evita postinstall nativo (Authenticode do cua-sdk na
        # raiz; puppeteer se voltar ao lock) no runner do Actions.
        run: npm ci --ignore-scripts
      - name: Run MCP tests
        working-directory: mcp-server
        run: npm test
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check v10/launcher.js
          node --check v10/security/origin-policy.js
          node --check v10/mobile/app.js
          node --check v10/mobile/sw.js
          node --test v10/security/origin-policy.test.mjs
          node --check mcp-server/index.js
          node --check mcp-server/security.js
