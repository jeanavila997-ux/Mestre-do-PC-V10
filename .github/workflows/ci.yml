name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install MCP dependencies
        working-directory: mcp-server
        # Único lifecycle script do lock: postinstall de @qwen-code/cua-sdk
        # (scripts/install-native.mjs). No Windows ele roda Get-AuthenticodeSignature
        # no worker UIAccess. Nos runners do Actions o módulo
        # Microsoft.PowerShell.Security não carrega (CouldNotAutoloadMatchingModule)
        # e o npm ci sai 1. Não há flag no pacote que pule só essa checagem
        # (QWEN_CUA_SDK_NATIVE_DIR ainda chama o mesmo cmdlet).
        # A suíte importa o facade JS (@qwen-code/cua-sdk/computer-use) e não
        # carrega o .exe nativo. No PC, npm ci em mcp-server segue com scripts
        # e a checagem Authenticode permanece.
        run: npm ci --ignore-scripts
      - name: Run MCP tests
        working-directory: mcp-server
        run: npm test
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check v10/launcher.js
          node --check v10/security/origin-policy.js
          node --check v10/mobile/app.js
          node --check v10/mobile/sw.js
          node --test v10/security/origin-policy.test.mjs
          node --check mcp-server/index.js
          node --check mcp-server/security.js
